x-common: &common
  build: .
  image: dockhand-server:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
  networks: [backend]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=dockhand
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=dockhand
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockhand -d dockhand"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    <<: *common
    environment:
      - PORT=3001
    networks: [backend, web]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.api.rule=Host(`api.deploydock.duckdns.org`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.services.api.loadbalancer.server.port=3001"

  worker-deploy:
    <<: *common
    command: ["node", "dist/workers/deploy.worker.js"]

  worker-actions:
    <<: *common
    command: ["node", "dist/workers/container-action.worker.js"]

volumes:
  pgdata:
  redisdata:

networks:
  web:
    external: true
  backend:
